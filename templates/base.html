<!DOCTYPE html>
<html>
<head>
    <title>Appdynamics Knowledge Base</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
	  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/"><center>Appdynamics Knowledge Base</center></a>

    <form class="d-flex ms-auto position-relative"
      action="/search"
      method="get"
      autocomplete="off">

    <input class="form-control me-2"
           type="search"
           id="searchInput"
           name="q"
           placeholder="Search..."
           aria-label="Search">

    <button class="btn btn-outline-light" type="submit">
        Search
    </button>

    <div id="searchResults"
         class="list-group position-absolute"
         style="top: 100%; right: 0; z-index: 1000; width: 320px;">
    </div>
	</form>
</nav>


<div class="container mt-4">
    {% block content %}{% endblock %}
</div>
<script>
const input = document.getElementById("searchInput");
const resultsBox = document.getElementById("searchResults");

input.addEventListener("input", function () {
    const query = this.value.trim();

    if (query.length < 2) {
        resultsBox.innerHTML = "";
        return;
    }

    fetch(`/api/search?q=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
            resultsBox.innerHTML = "";

            if (data.length === 0) {
                resultsBox.innerHTML =
                  '<div class="list-group-item text-muted">No results</div>';
                return;
            }

            data.forEach(item => {
                const a = document.createElement("a");
                a.href = item.url;
                a.className = "list-group-item list-group-item-action";
                a.textContent = item.title;
                resultsBox.appendChild(a);
            });
        });
});

// Hide dropdown when clicking outside
document.addEventListener("click", function (e) {
    if (!e.target.closest("form")) {
        resultsBox.innerHTML = "";
    }
});
</script>

</body>
</html>
