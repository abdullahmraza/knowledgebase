{% extends "base.html" %}

{% block content %}
<h4 class="mb-4">Knowledge Base</h4>

<div class="list-group">
    {% for key, name in categories.items() %}
    <a href="/category/{{ key }}"
       class="list-group-item list-group-item-action py-3">
        <h5 class="mb-1">{{ name }}</h5>
    </a>
    {% endfor %}
</div>
{% endblock %}
